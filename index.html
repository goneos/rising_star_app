<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rising Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#28363E;
    --ink-soft:#5B6B72;
    --amber:#E8A33D;
    --amber-deep:#C97F1D;
    --sky-top:#2E4A63;
    --sky-mid:#6B8CA8;
    --sky-horizon:#F3D9AE;
    --ground:#F3F6F5;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--ground);
    font-family:'Atkinson Hyperlegible', sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  #splash{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-horizon) 78%, var(--ground) 100%);
    transition: opacity 0.7s ease;
    cursor:pointer;
  }
  #splash.fade-out{ opacity:0; }

  .twinkle{
    position:absolute;
    width:4px; height:4px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    animation: tw 2.6s ease-in-out infinite;
  }
  @keyframes tw{
    0%,100%{ opacity:0; transform:scale(0.6); }
    50%{ opacity:0.85; transform:scale(1.2); }
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .star-wrap{
    position:relative;
    width: clamp(120px,16vw,180px);
    height: clamp(120px,16vw,180px);
    transform: translateY(120px);
    opacity:0;
    animation: rise 1.6s cubic-bezier(.22,1.1,.36,1) 0.3s forwards;
  }
  @keyframes rise{
    0%{ transform:translateY(140px) scale(0.7); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }

  .glow{
    position:absolute; inset:-30%;
    background: radial-gradient(circle, rgba(232,163,61,0.55) 0%, rgba(232,163,61,0) 70%);
    border-radius:50%;
    animation: pulse 2.2s ease-in-out infinite;
    animation-delay: 1.9s;
    opacity:0;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(0.9); opacity:0.5; }
    50%{ transform:scale(1.15); opacity:0.9; }
  }
  .star-wrap.settled .glow{ opacity:1; }

  svg.star{
    position:relative;
    width:100%; height:100%;
    filter: drop-shadow(0 6px 18px rgba(201,127,29,0.35));
  }

  .brand{
    margin-top: 34px;
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(28px,4vw,42px);
    font-weight:700;
    color:#fff;
    letter-spacing:0.5px;
    opacity:0;
    transform:translateY(10px);
    animation: fadeUp 0.9s ease 1.6s forwards;
    text-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .tagline{
    margin-top:10px;
    font-size: clamp(15px,1.6vw,18px);
    color: rgba(255,255,255,0.85);
    font-weight:400;
    opacity:0;
    animation: fadeUp 0.9s ease 2.1s forwards;
  }
  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .hint{
    position:absolute;
    bottom: 34px;
    font-size:14px;
    color: rgba(255,255,255,0.7);
    opacity:0;
    animation: fadeUp 0.8s ease 2.6s forwards;
  }
</style>
</head>
<body>

<div id="splash">
  <div class="stage" id="stage">
    <div class="star-wrap" id="starWrap">
      <div class="glow"></div>
      <svg class="star" viewBox="0 0 100 100">
        <path fill="#E8A33D" stroke="#C97F1D" stroke-width="2" stroke-linejoin="round"
          d="M50 6
             C53 28 58 40 50 50
             C58 40 74 42 92 44
             C74 46 60 54 55 66
             C60 78 58 92 50 100
             C48 92 42 78 45 66
             C40 54 26 46 8 44
             C26 42 42 40 45 50
             C42 40 47 28 50 6 Z"/>
      </svg>
    </div>
    <div class="brand">Rising Star</div>
    <div class="tagline">Getting your day ready&hellip;</div>
  </div>
  <div class="hint">Tap to continue</div>
</div>

<script>
  // scatter some twinkles
  const splash = document.getElementById('splash');
  for(let i=0;i<28;i++){
    const t = document.createElement('div');
    t.className = 'twinkle';
    t.style.left = Math.random()*100 + '%';
    t.style.top = (Math.random()*55) + '%';
    t.style.animationDelay = (Math.random()*2.6) + 's';
    splash.appendChild(t);
  }

  setTimeout(()=>{
    document.getElementById('starWrap').classList.add('settled');
  }, 1900);

  const HUB_URL = 'rising-star-hub.html';
  let navigated = false;
  function goToHub(){
    if(navigated) return;
    navigated = true;
    splash.classList.add('fade-out');
    setTimeout(()=>{ window.location.href = HUB_URL; }, 650);
  }

  // auto-advance after the animation plays
  setTimeout(goToHub, 3600);
  // let people skip it early
  splash.addEventListener('click', goToHub);
</script>

</body>
</html>
