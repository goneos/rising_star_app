<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rising Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-soft:#5B6B72;
    --teal:#17A5A0;
    --teal-deep:#0E7A76;
    --gold-light:#FDD64B;
    --gold:#F9BE00;
    --gold-deep:#D89A00;
    --bg:#FFFFFF;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:'Atkinson Hyperlegible', sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  #splash{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 38%, #FFFDF6 0%, #FFFFFF 55%, #F4FBFA 100%);
    transition: opacity 0.7s ease;
    cursor:pointer;
  }
  #splash.fade-out{ opacity:0; }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .star-wrap{
    position:relative;
    width: clamp(160px,22vw,240px);
    height: clamp(190px,26vw,285px);
    transform: translateY(130px);
    opacity:0;
    animation: rise 1.6s cubic-bezier(.22,1.1,.36,1) 0.3s forwards;
  }
  @keyframes rise{
    0%{ transform:translateY(150px) scale(0.7); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }

  .glow{
    position:absolute; inset:-22%;
    background: radial-gradient(circle, rgba(249,190,0,0.35) 0%, rgba(23,165,160,0) 70%);
    border-radius:50%;
    animation: pulse 2.2s ease-in-out infinite;
    animation-delay: 1.9s;
    opacity:0;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(0.9); opacity:0.5; }
    50%{ transform:scale(1.12); opacity:0.9; }
  }
  .star-wrap.settled .glow{ opacity:1; }

  svg.logo-mark{
    position:relative;
    width:100%; height:100%;
    filter: drop-shadow(0 8px 16px rgba(14,122,118,0.18));
  }

  .brand{
    margin-top: 8px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--teal);
    line-height:0.98;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    animation: fadeUp 0.9s ease 1.6s forwards;
  }
  .brand .line1{ font-size: clamp(30px,4.6vw,46px); display:block; }
  .brand .line2{ font-size: clamp(34px,5.2vw,52px); display:block; }

  .tagline{
    margin-top:14px;
    font-size: clamp(14px,1.6vw,17px);
    color: var(--ink-soft);
    font-weight:400;
    opacity:0;
    animation: fadeUp 0.9s ease 2.1s forwards;
  }
  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .hint{
    position:absolute;
    bottom: 34px;
    font-size:14px;
    color: var(--ink-soft);
    opacity:0;
    animation: fadeUp 0.8s ease 2.6s forwards;
  }
</style>
</head>
<body>

<div id="splash">
  <div class="stage" id="stage">
    <div class="star-wrap" id="starWrap">
      <div class="glow"></div>
      <svg class="logo-mark" viewBox="0 0 220 260">
        <defs>
          <linearGradient id="goldFace" x1="0%" y1="0%" x2="100%" y2="10%">
            <stop offset="0%" stop-color="#D89A00"/>
            <stop offset="48%" stop-color="#F9BE00"/>
            <stop offset="100%" stop-color="#FDD64B"/>
          </linearGradient>
        </defs>

        <!-- teal dome arc behind the star -->
        <path d="M 30 150 A 80 80 0 1 1 190 150 Z"
              fill="var(--gold)" stroke="var(--teal)" stroke-width="10" stroke-linejoin="round"/>

        <!-- star: teal outline layer -->
        <path transform="translate(110,140)"
          d="M0 -95 L22 -30 L92 -30 L36 10 L57 78 L0 36 L-57 78 L-36 10 L-92 -30 L-22 -30 Z"
          fill="var(--teal)"/>

        <!-- star: white separation ring -->
        <path transform="translate(110,140) scale(0.90)"
          d="M0 -95 L22 -30 L92 -30 L36 10 L57 78 L0 36 L-57 78 L-36 10 L-92 -30 L-22 -30 Z"
          fill="#FFFFFF"/>

        <!-- star: gold face -->
        <path transform="translate(110,140) scale(0.82)"
          d="M0 -95 L22 -30 L92 -30 L36 10 L57 78 L0 36 L-57 78 L-36 10 L-92 -30 L-22 -30 Z"
          fill="url(#goldFace)"/>

        <!-- subtle facet lines for a faceted-gem feel -->
        <g transform="translate(110,140) scale(0.82)" stroke="#C98600" stroke-width="2.5" opacity="0.55" stroke-linecap="round">
          <line x1="0" y1="0" x2="0" y2="-95"/>
          <line x1="0" y1="0" x2="57" y2="78"/>
          <line x1="0" y1="0" x2="-57" y2="78"/>
        </g>
      </svg>
    </div>
    <div class="brand">
      <span class="line1">Rising</span>
      <span class="line2">Star</span>
    </div>
    <div class="tagline">Getting your day ready&hellip;</div>
  </div>
  <div class="hint">Tap to continue</div>
</div>

<script>
  const splash = document.getElementById('splash');

  setTimeout(()=>{
    document.getElementById('starWrap').classList.add('settled');
  }, 1900);

  const HUB_URL = 'rising-star-hub.html';
  let navigated = false;
  function goToHub(){
    if(navigated) return;
    navigated = true;
    splash.classList.add('fade-out');
    setTimeout(()=>{ window.location.href = HUB_URL; }, 650);
  }

  setTimeout(goToHub, 3600);
  splash.addEventListener('click', goToHub);
</script>

</body>
</html>
